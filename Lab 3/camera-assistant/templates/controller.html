<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Assistant — Wizard</title>
<style>body{font:16px system-ui;background:#edf3f5;color:#10232d;max-width:1100px;margin:30px auto;padding:0 20px}section{background:white;padding:20px;border-radius:12px;margin:16px 0}button,input,textarea{font:inherit;padding:10px;margin:4px}button{cursor:pointer;background:#145d68;color:white;border:0;border-radius:6px}button:disabled{opacity:.4}textarea{box-sizing:border-box;width:100%;min-height:90px}#camera{max-width:100%;width:640px}#notice{color:#9b2525}pre{white-space:pre-wrap}#state{font-weight:bold}</style>
<h1>Camera Assistant · Wizard controller</h1>
<p>Frigate supplies detections. You approve every spoken answer.</p>
<section><label>Controller token <input id="token" type="password" autocomplete="off"></label><button id="connect">Connect</button><p id="notice"></p></section>
<section><span id="state">Disconnected</span><p id="health"></p><img id="camera" alt="Camera feed unavailable"><pre id="events"></pre></section>
<section><button id="trigger" disabled>Start voice turn</button><div id="simulation" hidden><label>Simulated transcript <input id="simtext" value="Is anyone in view?"></label><button id="simulate">Submit simulated turn</button><p>Software testing only: no microphone or spoken playback.</p></div><h2>Heard</h2><p id="heard">—</p><div id="suggestions"></div><textarea id="reply" aria-label="Reply to approve" maxlength="500"></textarea><button id="approve" disabled>Approve and speak</button><pre id="timing"></pre></section>
<script>
let token='',state=null,turnId=null,seen=null,busy=false,cameraUrl=null;
const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Controller-Token':token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error('Request failed ('+r.status+'). Check the token and current turn.');return r.json()}
$('connect').onclick=()=>{token=$('token').value;poll()};
$('trigger').onclick=async()=>{try{await api('/api/trigger',{});await poll()}catch(e){$('notice').textContent=e.message}};
$('simulate').onclick=async()=>{try{await api('/api/trigger',{text:$('simtext').value});await poll()}catch(e){$('notice').textContent=e.message}};
$('approve').onclick=async()=>{try{await api('/api/approve',{turn_id:turnId,reply:$('reply').value});await poll()}catch(e){$('notice').textContent=e.message}};
async function poll(){if(!token||busy)return;busy=true;try{const data=await api('/api/controller');state=data.state;turnId=data.turn?.id;$('state').textContent=state;$('notice').textContent=data.error||'';$('health').textContent=data.activity.available?'Frigate camera data available':'Frigate camera data unavailable or stale';$('events').textContent=JSON.stringify(data.activity,null,2);$('heard').textContent=data.turn?.text||'—';$('timing').textContent=JSON.stringify(data.turn?.timing||{},null,2);$('simulation').hidden=!data.simulation;$('trigger').disabled=state!=='IDLE'||data.simulation;$('simulate').disabled=state!=='IDLE';$('approve').disabled=state!=='THINKING';$('suggestions').replaceChildren();for(const [intent,text] of Object.entries(data.suggestions)){const b=document.createElement('button');b.textContent=intent;b.disabled=state!=='THINKING';b.onclick=()=>{$('reply').value=text};$('suggestions').append(b)}if(state==='THINKING'&&seen!==turnId){seen=turnId;$('reply').value=data.suggestions[data.turn.intent]||data.suggestions.unsupported}}catch(e){state=null;$('state').textContent='Disconnected';$('approve').disabled=true;$('trigger').disabled=true;$('notice').textContent=e.message}finally{busy=false}}
async function camera(){if(!token)return;try{const r=await fetch('/api/camera.jpg',{headers:{'X-Controller-Token':token}});if(!r.ok)throw Error();const blob=await r.blob();if(cameraUrl)URL.revokeObjectURL(cameraUrl);cameraUrl=URL.createObjectURL(blob);$('camera').src=cameraUrl}catch{$('camera').removeAttribute('src')}}
setInterval(poll,400);setInterval(camera,1500);
</script></html>
